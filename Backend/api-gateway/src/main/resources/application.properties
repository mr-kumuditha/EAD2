spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=servlet

# Service URLs
service.auth=http://localhost:8081
service.event=http://localhost:8082
service.ticket=http://localhost:8083
service.booking=http://localhost:8084
service.report=http://localhost:8085

# Multipart configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration for front-end developers
# If your frontend uses Vite (default port 5173) add it here. Examples:
# - single origin: cors.allowed-origins=http://localhost:3000
# - multiple origins: cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
